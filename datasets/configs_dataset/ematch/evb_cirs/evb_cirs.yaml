# ============================================================
# EMatch — Custom Dataset Config (inference only)
# ============================================================
# Fill in the fields marked with TODO before running.

name: 'EVB_CIRS'
task: 'disparity'           # 'disparity' or 'flow'
SequenceClass: 'CustomSequence_ematch'
SequenceNames: ['1_0m_outdoor_a_0_0_d_512_s_128_dt50']   # Arbitrary label(s) used for output folder names.
                                 # Add more entries if you have multiple recordings.

# Path to your HDF5 file.
# If you have multiple sequences, each entry in SequenceNames will use the SAME
# root_path. To use different files, create a separate eval.yaml per recording.
root_path: 'data/EVB_CIRS/hdf5/1_0m_out.hdf5'  # TODO: set this

split: 'test'

# ---- Event window ----
dt: 50          # Milliseconds of events to accumulate per sample
voxel_bins: 15   # Temporal bins (must match the trained model's input_dim)
stride: 33      # Step between consecutive windows in ms (default = dt → no overlap)

# ---- Resolution ----
# crop_size: target resolution fed to the model.  MUST be divisible by 32.
# The voxel grids are resized from (sensor_height x sensor_width) to crop_size.
crop_size: [512, 960]     # TODO: run once with calib_path set — loader prints the correct value for your camera
# crop_size: [704, 960]     # TODO: set this (must be divisible by 32 and match the trained model's input size)
# crop_size: [512, 640]


sensor_height: 720        # TODO: native height of your event camera (pixels)
sensor_width: 1280         # TODO: native width  of your event camera (pixels)

# ---- Stereo calibration (strongly recommended for disparity) ----
# Path to a Kalibr camchain YAML (cam0 = left, cam1 = right).
# Without this, events are NOT rectified and disparity output will be incorrect.
calib_path: 'data/EVB_CIRS/calibration/camchain-cirs_evb.yaml'

# ---- HDF5 path overrides (optional) ----
# By default the loader expects:
#   davis/left/events   and   davis/right/events
# as [N, 4] datasets (x, y, t, p) inside your HDF5 file.
# If your file uses different paths, uncomment and set these:
event_path_left:  'evk4_hd/left/events'
event_path_right: 'evk4_hd/right/events'

expected_disparity_at_1m: 128  # Optional sanity check for extrinsics. Set to None to disable. (px)
alpha: 0.0  # Optional correction factor (0-1) to shift rectified events based on expected disparity at 1m. Set to 0 to disable. (default=0.5 → shift by half the expected disparity)
disp_vmax: 512  # Max disparity for visualization (px). Adjust based on your scene and expected depth range.
